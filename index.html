
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="formulario">

        <h1>Fale Conosco</h1>

        <form action="https://formsubmit.co/vslssbarbosa@gmail.com" method="POST">

            <input type="hidden" name="_subject" value="Nova mensagem do site">

            <input type="hidden" name="_template" value="table">

            <input type="hidden" name="_next" value="http://127.0.0.1:5500/sucesso.html">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" name="assunto" required>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" maxlength="90" required></textarea>

            <button type="submit">Enviar Mensagem</button>

        </form>

    </div>

</body>
</html>
